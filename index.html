        function selectWitness(key) {
            // 樣式切換
            document.querySelectorAll('.witness-btn').forEach(btn => {
                btn.className = "witness-btn w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium transition flex items-center justify-between text-slate-600 hover:bg-slate-50";
            });
            const activeBtn = document.getElementById(`btn-${key}`);
            activeBtn.className = "witness-btn w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium transition flex items-center justify-between bg-rose-50 text-rose-700 border border-rose-200 shadow-sm";

            // 載入資料
            const data = witnessData[key];
            document.getElementById('w-name').innerText = data.name;
            document.getElementById('w-meta').innerText = data.meta;
            const badge = document.getElementById('w-badge');
            badge.className = `px-3 py-1 rounded-full text-xs font-medium ${data.badgeClass}`;
            badge.innerText = data.badgeText;

            // 渲染時間綫
            const container = document.getElementById('timeline-container');
            container.innerHTML = '';

            data.events.forEach((ev, index) => {
                const item = document.createElement('div');
                item.className = "relative pl-6 group";
                item.innerHTML = `
                    <div class="absolute -left-[25px] top-1.5 w-4 h-4 rounded-full bg-white border-4 border-indigo-600 group-hover:scale-110 transition"></div>
                    <div class="bg-slate-50 rounded-lg p-4 border border-slate-200 hover:shadow-md transition">
                        <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded border border-indigo-100">${ev.time}</span>
                        <h3 class="text-base font-bold text-slate-900 mt-2">${ev.title}</h3>
                        <p class="text-sm text-slate-600 mt-1 leading-relaxed">${ev.desc}</p>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // 初始化預設載入溫海晴
        window.onload = function() {
            selectWitness('wendy');
        };
